name: Release

on:
  push:
    branches: [main]
  # Lets a release be re-attempted without an empty commit, which matters when
  # a run fails for a reason outside the repository, such as a missing token.
  workflow_dispatch:

# Releasing happens here and nowhere else: this workflow decides the version,
# cuts the tag, and publishes the image carrying it. ci.yml deliberately does
# not publish on tags, so a version tag cannot appear without a release.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT lets the release commit trigger downstream workflows, which
          # the default GITHUB_TOKEN deliberately cannot do. Falls back so the
          # workflow still functions without one.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Only runs when release-please actually cut a release.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The release is only as trustworthy as the tests that gated it, and the
      # tag is a different commit from the one CI last checked.
      - run: go test -race ./...

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The released image reports its version, not its commit hash.
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
