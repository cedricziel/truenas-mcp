name: Release

on:
  push:
    branches: [main]
  # Lets a release be re-attempted without an empty commit, which matters when
  # a run fails for a reason outside the repository, such as a missing token.
  workflow_dispatch:

# Releasing happens here and nowhere else: this workflow decides the version,
# cuts the tag, and publishes the image carrying it. ci.yml deliberately does
# not publish on tags, so a version tag cannot appear without a release.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT lets the release commit trigger downstream workflows, which
          # the default GITHUB_TOKEN deliberately cannot do. Falls back so the
          # workflow still functions without one.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Only runs when release-please actually cut a release.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The release is only as trustworthy as the tests that gated it, and the
      # tag is a different commit from the one CI last checked.
      - run: go test -race ./...

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The released image reports its version, not its commit hash.
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Listing the server in the MCP registry is a separate job because it needs a
  # different privilege than pushing the image: an OIDC identity token rather
  # than package write. It runs after `publish` because the registry proves
  # ownership by pulling the image named in server.json and reading the
  # io.modelcontextprotocol.server.name label off it — so the image has to exist
  # first, and it has to be public, which the registry pulls anonymously.
  publish-registry:
    needs: [release-please, publish]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      # Deliberately unpinned: the registry rejects tokens minted by older
      # binaries with "invalid audience", and the upstream fix for that is to
      # re-fetch the latest release.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # OIDC means no long-lived registry credential exists in this repository
      # to leak or scope-creep. The namespace it grants, io.github.cedricziel,
      # follows from the repository owner.
      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      # server.json carries the released version because release-please bumps
      # it in the same PR that bumps the manifest.
      - name: Publish to the MCP registry
        run: ./mcp-publisher publish
