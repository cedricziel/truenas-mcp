version: 2

builds:
  - main: ./cmd/truenas-mcp
    binary: truenas-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# release-please owns CHANGELOG.md; GoReleaser must not generate its own.
changelog:
  disable: true

# release-please has already created the GitHub release for the tag by the
# time this runs. GoReleaser only uploads artifacts to it.
release:
  mode: keep-existing
