# TrueNAS SCALE custom app definition for truenas-mcp.
#
# Install via Apps -> Discover -> (kebab menu) -> Install via YAML, and paste
# this file into Custom Config.
#
# The top-level `services` key is required from TrueNAS 25.10 onward.
#
# Note what this does NOT do: it mounts no host socket and requests no
# privileged execution. The server reaches the middleware over the network
# even though it runs on the same box, so that every connection carries a
# user identity rather than root-equivalent socket access.

services:
  truenas-mcp:
    image: ghcr.io/cedricziel/truenas-mcp:main
    restart: unless-stopped

    ports:
      - "8770:8080"

    environment:
      # The TrueNAS instance to manage. Reached over the network, not a socket.
      TRUENAS_MCP_TARGET: "192.168.178.6"

      # Accept the target's certificate without verifying it.
      #
      # TrueNAS ships a self-signed certificate issued for CN=localhost with
      # only DNS:localhost as a SAN, so no address or hostname the container
      # can reach will ever validate. Replace the certificate on the target
      # and remove this to get a verified connection.
      #
      # Note that this is NOT the same as falling back to plaintext: the
      # connection stays encrypted, it is merely unauthenticated, and the API
      # key is never sent in the clear. That distinction is why certificate
      # verification and transport scheme are separate settings.
      TRUENAS_MCP_TARGET_INSECURE: "true"

      # Serve MCP without TLS on this listener.
      #
      # Correct only because a reverse proxy terminates TLS in front of this
      # container and forwards over the local network. Callers transmit their
      # own TrueNAS API keys, so the boundary they cross must be encrypted --
      # it just is not this process that encrypts it.
      #
      # If you expose this port directly instead, set TRUENAS_MCP_TLS_CERT and
      # TRUENAS_MCP_TLS_KEY and remove this.
      TRUENAS_MCP_ALLOW_PLAINTEXT: "true"

      # Mutating tools exposed. Each is a separate tool with its own MCP
      # annotation, so each is a separate consent decision in the client --
      # app_stop does not ride along with app_start.
      #
      # The unrecoverable-operation denylist still applies and is not
      # switchable: pool export, dataset deletion, disk wipe, and app deletion
      # with volume removal stay unreachable regardless of this setting.
      TRUENAS_MCP_ENABLE_WRITES: "true"

    healthcheck:
      # The image is distroless and carries no shell or curl, so the health
      # check runs the binary's own probe subcommand.
      test: ["CMD", "/usr/local/bin/truenas-mcp", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true
